var OvApp=__OV_TMP__;var __GH_REACT__=I;var __GH_TMP__=(function(e){"use strict";var v=e.useState,b=e.useEffect;const p={overview:"#F59E0B",seatmap:"#6BA8DD",airshopping:"#6BA8DD",servicelist:"#6BA8DD",offerprice:"#6BA8DD",orderview:"#6BA8DD"},h={overview:"\u{1F9ED}",seatmap:"\u{1F4BA}",airshopping:"\u{1F6EB}",servicelist:"\u{1F9F3}",offerprice:"\u{1F4B6}",orderview:"\u{1F4C4}"},S=["overview","seatmap","airshopping","servicelist","offerprice","orderview"],c={pt:{title:"Guia de Utiliza\xE7\xE3o",subtitle:"NDC Tools \xB7 IATA NDC 18.1",close:"Fechar",nav:"Sec\xE7\xF5es",tip:"clica p/ fixar"},en:{title:"User Guide",subtitle:"NDC Tools \xB7 IATA NDC 18.1",close:"Close",nav:"Sections",tip:"click to pin"}},f={pt:[{id:"overview",title:"Vis\xE3o Geral",subtitle:"Como funciona o NDC Tools",xmlType:null,intro:"O NDC Tools \xE9 um conjunto de 5 ferramentas para parsing e visualiza\xE7\xE3o de respostas XML IATA NDC 18.1. Cada ferramenta corresponde a um tipo de mensagem NDC espec\xEDfico e funciona de forma independente, inteiramente no browser.",blocks:[{heading:"Como funciona",items:["Todo o processamento acontece no browser \u2014 nenhum XML \xE9 enviado para qualquer servidor.","Arrasta um ficheiro XML para a zona de upload, ou clica para escolher o ficheiro manualmente.","Cada ferramenta espera um tipo de mensagem espec\xEDfico; se o XML n\xE3o corresponder, \xE9 apresentado um erro descritivo em vez de a ferramenta falhar silenciosamente.","Usa o bot\xE3o \u21A9 Novo XML para carregar outra resposta sem sair da ferramenta.","Usa o bot\xE3o \u2190 Hub para voltar \xE0 lista de ferramentas."]},{heading:"Idioma",items:["O seletor PT/EN no canto superior direito muda o idioma de toda a interface, incluindo este guia.","A prefer\xEAncia de idioma aplica-se de forma consistente em todas as ferramentas do Hub."]},{heading:"Ferramentas dispon\xEDveis",items:["Seat Availability \u2014 mapa de lugares interativo (SeatAvailabilityRS)","Air Shopping \u2014 resultados de pesquisa de voos (AirShoppingRS)","Service List \u2014 servi\xE7os ancilares (ServiceListRS)","Offer Price \u2014 compara\xE7\xE3o de tarifas e upsell (OfferPriceRS)","Order View \u2014 detalhe completo de reserva (OrderViewRS)"]}]},{id:"seatmap",title:"Seat Availability",subtitle:"SeatAvailabilityRS \xB7 PADIS 9825",xmlType:"SeatAvailabilityRS",intro:"Mapa de lugares interativo com fuselagem, asas, m\xFAltiplas cabines, m\xFAltiplos voos e sele\xE7\xE3o de lugares por passageiro.",blocks:[{heading:"Como usar",items:["Arrasta um XML SeatAvailabilityRS para a zona de upload.","Se a resposta tiver mais do que um voo, aparecem separadores no topo para alternar entre eles.","As asas aparecem automaticamente sobre as filas com caracter\xEDstica de overwing (K) \u2014 s\xE3o apenas decorativas."]},{heading:"Filtros",items:["\u2713 Dispon\xEDveis \u2014 oculta lugares ocupados.","\u{1FA9F} Janela \xB7 \u2194 Corredor \xB7 \u2195 Leg space \u2014 mostra apenas lugares com essa caracter\xEDstica.","\u2717 Sem restr. \u2014 oculta lugares com caracter\xEDstica de restri\xE7\xE3o.","Os filtros combinam-se entre si; lugares n\xE3o correspondentes ficam semi-transparentes em vez de desaparecerem, para n\xE3o perderes a orienta\xE7\xE3o no mapa."]},{heading:"Sele\xE7\xE3o de lugares",items:["Clica num lugar dispon\xEDvel para o selecionar; clica novamente para o remover.","O n\xFAmero m\xE1ximo de lugares selecion\xE1veis corresponde ao n\xFAmero de passageiros indicado no XML.","Ao atingir o limite, novos lugares ficam bloqueados at\xE9 libertares uma sele\xE7\xE3o.","A barra de sele\xE7\xE3o mostra cada lugar associado ao respetivo passageiro (refer\xEAncia + tipo de passageiro)."]},{heading:"Tooltips (hover)",items:["Passa o rato sobre um lugar para ver: n\xFAmero do lugar, tipo (badge colorido), caracter\xEDsticas IATA PADIS 9825 e pre\xE7o, se aplic\xE1vel."]},{heading:"Atalhos de c\xF3pia",items:["Clica numa linha da barra de sele\xE7\xE3o para copiar os dados desse lugar (refer\xEAncia da oferta, passageiro, segmento, fila e coluna), separados por tabula\xE7\xE3o.","Usa 'Copiar todos' para copiar todas as sele\xE7\xF5es de uma s\xF3 vez, uma linha por lugar \u2014 \xFAtil para colar diretamente numa folha de c\xE1lculo ou sistema de reserva."]},{heading:"Legenda de cores",items:["Verde \u2014 Exit + Leg Space (sa\xEDda com espa\xE7o extra)","Laranja \u2014 Exit Row (fila de sa\xEDda, reclina\xE7\xE3o restrita)","Roxo \u2014 Bassinet (ber\xE7o)","Azul \u2014 Extra Legroom (espa\xE7o extra pago)","Ciano \u2014 Standard (econ\xF3mica normal)","Vermelho \u2014 Restricted (lugar restrito)","Cinza escuro \u2014 Occupied (ocupado, n\xE3o selecion\xE1vel)","\xC2mbar \u2014 Selected (selecionado por ti)"]}]},{id:"airshopping",title:"Air Shopping",subtitle:"AirShoppingRS \xB7 PADIS 9864",xmlType:"AirShoppingRS",intro:"Compara ofertas de voo lado a lado, com brands, RBDs, franquia de bagagem e pre\xE7os detalhados por tro\xE7o e por passageiro.",blocks:[{heading:"Como usar",items:["Arrasta um XML AirShoppingRS.","Cada oferta (Offer) aparece num cart\xE3o, mostrando todos os tro\xE7os (bounds) inclu\xEDdos.","Usa a pagina\xE7\xE3o no fundo da lista quando existirem mais de 20 ofertas."]},{heading:"Ordena\xE7\xE3o",items:["\u2191 / \u2193 Pre\xE7o \u2014 do mais barato ao mais caro, ou vice-versa.","\u2191 / \u2193 Dura\xE7\xE3o \u2014 soma da dura\xE7\xE3o de todos os tro\xE7os da oferta.","\u2191 / \u2193 Partida \u2014 hora de partida do primeiro segmento."]},{heading:"Tooltips (hover)",items:["Brand (badge colorido) \u2014 mostra o nome da tarifa e a lista de amenidades inclu\xEDdas.","\u{1F9F3} Bagagem \u2014 mostra a quantidade de pe\xE7as e a descri\xE7\xE3o da franquia.","Pre\xE7o do tro\xE7o \u2014 mostra a base tarif\xE1ria, taxas e total desse tro\xE7o espec\xEDfico.","Pre\xE7o total (lado direito do cart\xE3o) \u2014 mostra o breakdown de todos os tro\xE7os, base/taxas/total, e o valor por passageiro quando h\xE1 mais do que um."]},{heading:"Atalhos de c\xF3pia",items:["Clica em qualquer parte do cart\xE3o de uma oferta para copiar o respetivo OfferID para a \xE1rea de transfer\xEAncia."]},{heading:"Casos especiais",items:["Quando existem m\xFAltiplos passageiros, o valor 'por passageiro' aparece automaticamente por baixo do total, sem c\xE1lculo manual necess\xE1rio."]}]},{id:"servicelist",title:"Ancillary Services",subtitle:"ServiceListRS \xB7 PADIS 9964 \xB7 IATA Res. 728",xmlType:"ServiceListRS",intro:"Agrupa servi\xE7os ancilares por categoria, com detalhe de BookingInstructions, c\xF3digos RFIC/RFISC e pre\xE7os por passageiro e segmento.",blocks:[{heading:"Como usar",items:["Arrasta um XML ServiceListRS.","Os servi\xE7os s\xE3o agrupados automaticamente por categoria (Bagagem, Viagem, Animais, M\xE9dico, N\xE3o Acompanhado, Lounge, Lugar, Refei\xE7\xF5es, Frequent Flyer, Gratuitos, Outros).","Usa os separadores de categoria para filtrar, ou o campo de pesquisa para procurar por nome ou c\xF3digo de servi\xE7o."]},{heading:"Filtros",items:["\u{1F381} Gratuitos / \u{1F4B3} Pagos \u2014 filtra por servi\xE7os com ou sem custo associado.","Segmento / Passageiro \u2014 restringe a lista a um segmento de voo ou passageiro espec\xEDfico."]},{heading:"Tooltips (hover / clique)",items:["Texto OSI (quando presente) \u2014 passa o rato para pr\xE9-visualizar; clica para fixar o detalhe da estrutura BookingInstructions.","No detalhe fixado v\xEAs a \xE1rvore de placeholders (%GRUPO%, %SUBGRUPO%) com o padr\xE3o ou express\xE3o regular associado a cada um, com legenda de cores para distinguir valores fixos de padr\xF5es regex.","Clica no \u2715 para fechar o detalhe fixado, ou clica fora da janela."]},{heading:"Atalhos de c\xF3pia",items:["Clica em qualquer linha de servi\xE7o para copiar, separados por tabula\xE7\xE3o: OfferItemID, refer\xEAncia de passageiro, refer\xEAncia(s) de segmento e ServiceDefinitionRefID."]},{heading:"Casos especiais",items:["Se o XML n\xE3o incluir nenhuma oferta \xE0 la carte, a ferramenta mostra uma lista vazia em vez de erro \u2014 \xE9 um cen\xE1rio de neg\xF3cio v\xE1lido (sem ancilares dispon\xEDveis para este itiner\xE1rio ou passageiro), n\xE3o uma falha de processamento.","Se um item de oferta n\xE3o indicar elegibilidade de passageiro, esse campo aparece como n\xE3o definido em vez de a ferramenta interromper o carregamento do ficheiro."]}]},{id:"offerprice",title:"Offer Price",subtitle:"OfferPriceRS \xB7 Upsell & Ancillaries",xmlType:"OfferPriceRS",intro:"Mostra a oferta atualmente selecionada, alternativas de upsell e servi\xE7os inclu\xEDdos, com compara\xE7\xE3o visual de brands e pre\xE7os.",blocks:[{heading:"Como usar",items:["Arrasta um XML OfferPriceRS.","A oferta atual (PricedOffer) aparece destacada com o r\xF3tulo 'Actual'.","As alternativas (OtherOffers), se existirem, aparecem por baixo, orden\xE1veis."]},{heading:"Compara\xE7\xE3o de tarifas",items:["Se existir mais do que uma brand entre as ofertas, uma tabela expans\xEDvel mostra todas as amenidades lado a lado, por brand.","As c\xE9lulas s\xE3o coloridas: verde (inclu\xEDdo/gratuito), \xE2mbar (parcial ou com penalidade), cinza (n\xE3o inclu\xEDdo)."]},{heading:"Ordena\xE7\xE3o",items:["\u2191 / \u2193 Pre\xE7o \u2014 valor absoluto da alternativa.","\u2191 / \u2193 Diferen\xE7a \u2014 face ao pre\xE7o da oferta atual.","Brand \u2014 pela ordem de brands definida no XML."]},{heading:"Tooltips (hover / clique para fixar)",items:["Pre\xE7o total \u2014 mostra o breakdown por tro\xE7o, base, taxas e valor por passageiro.","Brand \u2014 mostra a lista completa de amenidades dessa tarifa.","Expira\xE7\xE3o \u2014 mostra a data e hora completas em que a oferta expira."]},{heading:"Servi\xE7os inclu\xEDdos",items:["Se a oferta tiver servi\xE7os associados, aparecem agrupados por tipo de servi\xE7o, com badge Obrigat\xF3rio/Opcional e pre\xE7o.","Clica numa linha de servi\xE7o para copiar os respetivos identificadores (OfferItemID, refer\xEAncia do servi\xE7o, passageiro, segmento)."]},{heading:"Atalhos de c\xF3pia",items:["Clica em qualquer cart\xE3o de oferta para copiar o respetivo OfferID."]},{heading:"Casos especiais",items:["Se os tro\xE7os de uma oferta usarem brands diferentes entre si, aparece o aviso '\u2726 Combina\xE7\xE3o de tarifas por segmento' \u2014 a oferta n\xE3o \xE9 uniforme numa \xFAnica brand."]}]},{id:"orderview",title:"Order View",subtitle:"OrderViewRS \xB7 Reserva Completa",xmlType:"OrderViewRS",intro:"Apresenta o itiner\xE1rio completo de uma reserva: passageiros, servi\xE7os associados, bilhetes, EMDs e pagamentos.",blocks:[{heading:"Como usar",items:["Arrasta um XML OrderViewRS.","O cabe\xE7alho mostra a refer\xEAncia de reserva (booking reference), a transportadora e o pre\xE7o total da ordem \u2014 passa o rato sobre o pre\xE7o para ver o breakdown."]},{heading:"Sec\xE7\xF5es",items:["Itiner\xE1rio \u2014 todos os segmentos de voo, seguidos do detalhe de tarifa por passageiro.","Passageiros \u2014 um cart\xE3o por passageiro, com os servi\xE7os associados (lugares selecionados e outros servi\xE7os).","Bilhetes / EMDs \u2014 documentos emitidos, com cup\xF5es, fare basis, c\xF3digos RFIC/RFISC e refer\xEAncias de conex\xE3o a outros documentos.","Pagamentos \u2014 m\xE9todo, valor e refer\xEAncia ao item da ordem.","Informa\xE7\xE3o Adicional \u2014 instru\xE7\xF5es OSI em texto livre."]},{heading:"Estados de servi\xE7os e segmentos",items:["HK \u2014 Confirmado (verde)","TK \u2014 Modificado (azul)","UN \u2014 N\xE3o confirmado (\xE2mbar)","UC \u2014 N\xE3o confirmado / cancelado (laranja)","NO \u2014 Sem a\xE7\xE3o (vermelho)","WL \u2014 Lista de espera (vermelho)"]},{heading:"Tooltips (hover / clique)",items:["Pre\xE7o total da ordem \u2014 hover mostra base, taxas e total.","Pre\xE7o por passageiro na sec\xE7\xE3o de itiner\xE1rio \u2014 clica para ver o breakdown detalhado de taxas, c\xF3digo a c\xF3digo.","Brand da tarifa \u2014 hover mostra as amenidades inclu\xEDdas."]},{heading:"Atalhos de c\xF3pia",items:["Clica num bilhete ou EMD para copiar o respetivo n\xFAmero de documento."]}]}],en:[{id:"overview",title:"Overview",subtitle:"How NDC Tools works",xmlType:null,intro:"NDC Tools is a set of 5 tools for parsing and visualising IATA NDC 18.1 XML responses. Each tool matches a specific NDC message type and works independently, entirely in the browser.",blocks:[{heading:"How it works",items:["All processing happens in the browser \u2014 no XML is ever sent to a server.","Drag an XML file onto the upload zone, or click to choose a file manually.","Each tool expects a specific message type; if the XML doesn't match, a descriptive error is shown instead of the tool failing silently.","Use the \u21A9 New XML button to load another response without leaving the tool.","Use the \u2190 Hub button to return to the tool list."]},{heading:"Language",items:["The PT/EN switch in the top-right corner changes the language of the whole interface, including this guide.","The language preference applies consistently across all tools in the Hub."]},{heading:"Available tools",items:["Seat Availability \u2014 interactive seat map (SeatAvailabilityRS)","Air Shopping \u2014 flight search results (AirShoppingRS)","Service List \u2014 ancillary services (ServiceListRS)","Offer Price \u2014 fare comparison & upsell (OfferPriceRS)","Order View \u2014 full booking detail (OrderViewRS)"]}]},{id:"seatmap",title:"Seat Availability",subtitle:"SeatAvailabilityRS \xB7 PADIS 9825",xmlType:"SeatAvailabilityRS",intro:"Interactive seat map with fuselage, wings, multiple cabins, multiple flights and per-passenger seat selection.",blocks:[{heading:"How to use",items:["Drag a SeatAvailabilityRS XML onto the upload zone.","If the response covers more than one flight, tabs appear at the top to switch between them.","Wings appear automatically over rows flagged as overwing (K) \u2014 purely decorative."]},{heading:"Filters",items:["\u2713 Available \u2014 hides occupied seats.","\u{1FA9F} Window \xB7 \u2194 Aisle \xB7 \u2195 Leg space \u2014 shows only seats with that characteristic.","\u2717 No restrict. \u2014 hides seats flagged as restricted.","Filters combine with each other; non-matching seats become semi-transparent instead of disappearing, so you keep your bearings on the map."]},{heading:"Seat selection",items:["Click an available seat to select it; click again to deselect.","The maximum number of selectable seats matches the number of passengers declared in the XML.","Once the limit is reached, further seats are locked until you free up a selection.","The selection bar shows each seat matched to its passenger (reference + passenger type)."]},{heading:"Tooltips (hover)",items:["Hover over a seat to see: seat number, type (colour badge), IATA PADIS 9825 characteristics and price, if applicable."]},{heading:"Copy shortcuts",items:["Click a row in the selection bar to copy that seat's data (offer reference, passenger, segment, row and column), tab-separated.","Use 'Copy all' to copy every selection at once, one line per seat \u2014 handy for pasting straight into a spreadsheet or booking system."]},{heading:"Colour legend",items:["Green \u2014 Exit + Leg Space","Orange \u2014 Exit Row (restricted recline)","Purple \u2014 Bassinet","Blue \u2014 Extra Legroom (paid)","Cyan \u2014 Standard economy","Red \u2014 Restricted seat","Dark grey \u2014 Occupied, not selectable","Amber \u2014 Selected by you"]}]},{id:"airshopping",title:"Air Shopping",subtitle:"AirShoppingRS \xB7 PADIS 9864",xmlType:"AirShoppingRS",intro:"Compares flight offers side by side, with brands, RBDs, baggage allowance and detailed pricing per bound and per passenger.",blocks:[{heading:"How to use",items:["Drag an AirShoppingRS XML.","Each offer appears as a card, showing every bound included.","Use pagination at the bottom of the list when there are more than 20 offers."]},{heading:"Sorting",items:["\u2191 / \u2193 Price \u2014 cheapest to most expensive, or the reverse.","\u2191 / \u2193 Duration \u2014 total duration across all bounds in the offer.","\u2191 / \u2193 Departure \u2014 departure time of the first segment."]},{heading:"Tooltips (hover)",items:["Brand (colour badge) \u2014 shows the fare name and the list of included amenities.","\u{1F9F3} Baggage \u2014 shows piece quantity and allowance description.","Bound price \u2014 shows base fare, taxes and total for that specific bound.","Total price (right side of the card) \u2014 shows the breakdown across all bounds, base/tax/total, and the per-passenger amount when there's more than one."]},{heading:"Copy shortcuts",items:["Click anywhere on an offer card to copy its OfferID to the clipboard."]},{heading:"Special cases",items:["With multiple passengers, the 'per passenger' value appears automatically below the total \u2014 no manual calculation needed."]}]},{id:"servicelist",title:"Ancillary Services",subtitle:"ServiceListRS \xB7 PADIS 9964 \xB7 IATA Res. 728",xmlType:"ServiceListRS",intro:"Groups ancillary services by category, with BookingInstructions detail, RFIC/RFISC codes and per-passenger/per-segment pricing.",blocks:[{heading:"How to use",items:["Drag a ServiceListRS XML.","Services are automatically grouped by category (Baggage, Travel Services, Pets, Medical, Unaccompanied, Lounge, Seat, Meals, Frequent Flyer, Free Services, Other).","Use the category tabs to filter, or the search box to look up services by name or code."]},{heading:"Filters",items:["\u{1F381} Free / \u{1F4B3} Paid \u2014 filters by services with or without an associated cost.","Segment / Passenger \u2014 narrows the list to a specific flight segment or passenger."]},{heading:"Tooltips (hover / click)",items:["OSI text (when present) \u2014 hover to preview; click to pin the BookingInstructions structure detail open.","The pinned detail shows the placeholder tree (%GROUP%, %SUBGROUP%) with the pattern or regular expression tied to each one, colour-coded to distinguish fixed values from regex patterns.","Click \u2715 to close the pinned detail, or click outside the panel."]},{heading:"Copy shortcuts",items:["Click any service row to copy, tab-separated: OfferItemID, passenger reference, segment reference(s) and ServiceDefinitionRefID."]},{heading:"Special cases",items:["If the XML contains no \xE0 la carte offer at all, the tool shows an empty list instead of an error \u2014 that's a valid business scenario (no ancillaries available for this itinerary or passenger), not a processing failure.","If an offer item doesn't state passenger eligibility, that field shows as undefined instead of the tool stopping the file from loading."]}]},{id:"offerprice",title:"Offer Price",subtitle:"OfferPriceRS \xB7 Upsell & Ancillaries",xmlType:"OfferPriceRS",intro:"Shows the currently selected offer, upsell alternatives and included services, with visual brand and price comparison.",blocks:[{heading:"How to use",items:["Drag an OfferPriceRS XML.","The current offer (PricedOffer) is highlighted with a 'Current' label.","Alternatives (OtherOffers), if present, appear below, sortable."]},{heading:"Fare comparison",items:["If more than one brand is present across the offers, an expandable table shows every amenity side by side, per brand.","Cells are colour-coded: green (included/free), amber (partial or with penalty), grey (not included)."]},{heading:"Sorting",items:["\u2191 / \u2193 Price \u2014 the alternative's absolute value.","\u2191 / \u2193 Difference \u2014 versus the current offer's price.","Brand \u2014 following the brand order defined in the XML."]},{heading:"Tooltips (hover / click to pin)",items:["Total price \u2014 shows the breakdown per bound, base, taxes and per-passenger value.","Brand \u2014 shows the full list of that fare's amenities.","Expiry \u2014 shows the full date and time the offer expires."]},{heading:"Included services",items:["If the offer has associated services, they appear grouped by service type, with a Mandatory/Optional badge and price.","Click a service row to copy its identifiers (OfferItemID, service reference, passenger, segment)."]},{heading:"Copy shortcuts",items:["Click any offer card to copy its OfferID."]},{heading:"Special cases",items:["If an offer's bounds use different brands from each other, a '\u2726 Mixed fare brands across segments' warning appears \u2014 the offer isn't uniform under a single brand."]}]},{id:"orderview",title:"Order View",subtitle:"OrderViewRS \xB7 Full Booking",xmlType:"OrderViewRS",intro:"Displays the complete itinerary of a booking: passengers, associated services, tickets, EMDs and payments.",blocks:[{heading:"How to use",items:["Drag an OrderViewRS XML.","The header shows the booking reference, the carrier and the order's total price \u2014 hover over the price to see the breakdown."]},{heading:"Sections",items:["Itinerary \u2014 all flight segments, followed by the per-passenger fare detail.","Passengers \u2014 one card per passenger, with associated services (selected seats and other services).","Tickets / EMDs \u2014 issued documents, with coupons, fare basis, RFIC/RFISC codes and connection references to other documents.","Payments \u2014 method, amount and reference to the order item.","Additional Information \u2014 free-text OSI instructions."]},{heading:"Service / segment statuses",items:["HK \u2014 Confirmed (green)","TK \u2014 Amended (blue)","UN \u2014 Unconfirmed (amber)","UC \u2014 Unable to confirm / cancelled (orange)","NO \u2014 No action (red)","WL \u2014 Waitlisted (red)"]},{heading:"Tooltips (hover / click)",items:["Order total price \u2014 hover shows base, taxes and total.","Per-passenger price in the itinerary section \u2014 click to see the detailed tax breakdown, code by code.","Fare brand \u2014 hover shows the included amenities."]},{heading:"Copy shortcuts",items:["Click a ticket or EMD to copy its document number."]}]}]};function y({heading:o,items:a,accent:r}){return e.createElement("div",{style:{marginBottom:18}},e.createElement("div",{style:{fontSize:11,fontWe
